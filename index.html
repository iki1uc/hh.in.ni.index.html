<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>energie.vektor · Level‑6 Energie‑Achse</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#000;color:#0f0;font-family:Consolas, monospace;padding:20px;}
pre{background:#111;padding:12px;border:1px solid #333;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.cell{background:#111;border:1px solid #333;padding:20px;text-align:center;}
button{background:#111;color:#0f0;border:1px solid #333;padding:8px 16px;margin-top:10px;}
</style>
</head>

<body>

<h1>energie.vektor · Energie‑Achse (6e)</h1>
<p>Die Energie‑Ebene des neuen 6‑Vektor‑Systems.</p>

<hr>

<h2>8‑Richtungen + Continuum‑Punkt</h2>

<div class="grid">
  <div class="cell">NW</div>
  <div class="cell">N</div>
  <div class="cell">NE</div>

  <div class="cell">W</div>
  <div class="cell" style="background:#222;">∞<br><small>Continuum</small></div>
  <div class="cell">E</div>

  <div class="cell">SW</div>
  <div class="cell">S</div>
  <div class="cell">SE</div>
</div>

<hr>

<h2>Energie‑Score</h2>
<pre id="score">Bereit...</pre>

<button onclick="calc()">ENERGIE‑BERECHNEN</button>

<script src="anker.js"></script>
<script src="atom.js"></script>
<script src="respo.js"></script>

<script>
function calc(){
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  const base = 8;
  const continuum = base / 8; // dein 9. Punkt
  const energy = dirs.length * 2; // X2 scaling
  const total = energy + continuum;

  const out = {
    vektor: "energie.vektor",
    richtungen: dirs.length,
    continuum: continuum,
    scaling: "X2",
    score: total,
    status: "ok"
  };

  score.textContent = JSON.stringify(out, null, 2);
}
</script>

</body>
</html>
